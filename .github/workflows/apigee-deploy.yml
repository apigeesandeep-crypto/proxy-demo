# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/apigee-deploy.yml
#
# CI/CD pipeline for Apigee API Proxy: proxy-demo-1
# Repository: proxy-demo (github.com/<YOUR_ORG>/proxy-demo)
#
# Required GitHub Secrets:
#   GCP_PROJECT_ID        – Your GCP project ID that hosts the Apigee eval org
#   APIGEE_ENV            – Target Apigee environment name  (e.g. eval)
#   APIGEE_ORG            – Apigee organisation name       (usually = GCP project ID)
#   WORKLOAD_IDENTITY_PROVIDER – Full WIF provider resource name
#   SERVICE_ACCOUNT_EMAIL      – SA email used for keyless auth
# ────────────────────────────────────────────────────────────────────────────

name: Apigee Proxy CI/CD – proxy-demo-1

on:
  push:
    branches:
      - test
    paths:
      - 'apiproxy/**'
      - 'scripts/**'
      - '.github/workflows/apigee-deploy.yml'

env:
  PROXY_NAME: proxy-demo-1
  BUNDLE_DIR: bundle
  BUNDLE_ZIP: proxy-demo-1.zip

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# ── JOB 1 ── Scaffold & Generate ─────────────────────────────────────────────
  scaffold-and-generate:
    name: 1 · Scaffold & Generate XML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create proxy folder structure
        run: |
          echo "==> Running create_structure.py …"
          python scripts/create_structure.py ${{ env.BUNDLE_DIR }}

      - name: Generate XML configuration files
        run: |
          echo "==> Running generate_xml.py …"
          python scripts/generate_xml.py ${{ env.BUNDLE_DIR }}

      - name: Display generated files
        run: |
          echo "==> Generated XML files:"
          find ${{ env.BUNDLE_DIR }} -name "*.xml" | sort
          echo ""
          echo "==> Contents of root descriptor:"
          cat ${{ env.BUNDLE_DIR }}/apiproxy/${{ env.PROXY_NAME }}.xml

      - name: Upload proxy bundle source
        uses: actions/upload-artifact@v4
        with:
          name: proxy-bundle-src
          path: ${{ env.BUNDLE_DIR }}/
          retention-days: 1


# ── JOB 2 ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: 2 · Apigee Lint Checks
    runs-on: ubuntu-latest
    needs: scaffold-and-generate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install apigeelint
        run: npm install -g apigeelint

      - name: Download proxy bundle source
        uses: actions/download-artifact@v4
        with:
          name: proxy-bundle-src
          path: ${{ env.BUNDLE_DIR }}/

      - name: Run apigeelint
        run: |
          echo "==> Running apigeelint on ${{ env.BUNDLE_DIR }}/apiproxy …"
          apigeelint \
            -s ${{ env.BUNDLE_DIR }}/apiproxy \
            -f table.js \
            --profile apigee \
            --exitcode warn
          echo "==> Lint check completed."

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.BUNDLE_DIR }}/
          retention-days: 7


# ── JOB 3 ── Package ─────────────────────────────────────────────────────────
  package:
    name: 3 · Package & Zip Proxy Bundle
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Download proxy bundle source
        uses: actions/download-artifact@v4
        with:
          name: proxy-bundle-src
          path: ${{ env.BUNDLE_DIR }}/

      - name: Create proxy zip bundle
        run: |
          echo "==> Packaging proxy bundle …"
          cd ${{ env.BUNDLE_DIR }}
          zip -r ../${{ env.BUNDLE_ZIP }} apiproxy/
          cd ..
          echo "==> Bundle created: ${{ env.BUNDLE_ZIP }}"
          echo "==> Bundle size: $(du -sh ${{ env.BUNDLE_ZIP }} | cut -f1)"
          echo "==> Bundle contents:"
          unzip -l ${{ env.BUNDLE_ZIP }}

      - name: Upload zipped bundle
        uses: actions/upload-artifact@v4
        with:
          name: proxy-zip-bundle
          path: ${{ env.BUNDLE_ZIP }}
          retention-days: 7


# ── JOB 4 ── Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: 4 · Deploy to Apigee Eval (Keyless Auth)
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation (keyless)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download zipped proxy bundle
        uses: actions/download-artifact@v4
        with:
          name: proxy-zip-bundle

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Import proxy bundle to Apigee
        id: import
        run: |
          echo "==> Importing proxy bundle to Apigee …"

          RESPONSE=$(curl -s -X POST \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/apis?action=import&name=${{ env.PROXY_NAME }}&validate=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${{ env.BUNDLE_ZIP }}")

          echo "==> Import response:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

          # Extract the revision number from the response
          REVISION=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('revision', data.get('name','').split('/')[-1]))
          " 2>/dev/null || echo "1")

          echo "==> Proxy revision: $REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy proxy revision to eval environment
        run: |
          REVISION="${{ steps.import.outputs.revision }}"
          echo "==> Deploying revision $REVISION to environment: ${{ secrets.APIGEE_ENV }} …"

          RESPONSE=$(curl -s -X POST \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/${{ env.PROXY_NAME }}/revisions/${REVISION}/deployments?override=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Length: 0")

          echo "==> Deployment response:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

          # Verify deployment state
          STATE=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('state', 'UNKNOWN'))
          " 2>/dev/null || echo "UNKNOWN")

          echo "==> Deployment state: $STATE"

          if [ "$STATE" = "READY" ] || [ "$STATE" = "PROGRESSING" ]; then
            echo "==> Deployment initiated successfully."
          else
            echo "::warning::Deployment state is '$STATE'. Verify in Apigee console."
          fi

      - name: Verify deployment status
        run: |
          echo "==> Verifying deployment …"

          RESPONSE=$(curl -s \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/${{ env.PROXY_NAME }}/deployments" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}")

          echo "==> Deployment status:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

      - name: Deployment summary
        run: |
          echo "──────────────────────────────────────────"
          echo "  Proxy Name : ${{ env.PROXY_NAME }}"
          echo "  Org        : ${{ secrets.APIGEE_ORG }}"
          echo "  Environment: ${{ secrets.APIGEE_ENV }}"
          echo "  Revision   : ${{ steps.import.outputs.revision }}"
          echo "  Triggered by: ${{ github.actor }}"
          echo "  Commit SHA : ${{ github.sha }}"
          echo "──────────────────────────────────────────"
